---
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/setup-node
      - name: Install
        run: pnpm i
      - name: Lint
        run: pnpm run lint
      - name: Markdown Lint
        run: pnpm run lint:md
      - name: Spell Lint
        run: pnpm run lint:spell

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/setup-node
      - name: Install
        run: pnpm i
      - name: Build
        run: pnpm run build

  test:
    runs-on: ${{ matrix.os }}
    needs: build
    permissions:
      pull-requests: write
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest]
        node_version: [16, 18]
        include:
          - os: macos-latest
            node_version: 18
          - os: windows-latest
            node_version: 18
      fail-fast: false

    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/setup-node
        with:
          node-version: ${{ matrix.node_version }}
      - name: Install
        run: pnpm i
      - name: Test
        run: |
          pnpm run test:ci
      - name: Codecov
        uses: codecov/codecov-action@v3
        if: matrix.os == 'ubuntu-latest' && matrix.node_version == 18
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test_cli:
    runs-on: ${{ matrix.os }}
    needs: build
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node_version: [16, 18]
      fail-fast: false
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/setup-node
        with:
          node-version: ${{ matrix.node_version }}
      - name: Install
        run: pnpm i
      - name: Test CLI
        run: pnpm run test:cli

  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - uses: ./.github/actions/setup-node
      - name: Install
        run: pnpm i
      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: ./
          args: >
            -Dsonar.verbose=true
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.organization=rjoydip
            -Dsonar.projectKey=rjoydip_gfft
            -Dsonar.tests=**/test/
            -Dsonar.sources=**/src/**
            -Dsonar.cpd.exclusions=**/test/**
            -Dsonar.test.exclusions=**/test/**
            -Dsonar.typescript.tsconfigPath=tsconfig.json
            -Dsonar.typescript.lcov.reportPaths=coverage/lcov-report

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - uses: ./.github/actions/setup-node
      - name: Install
        run: pnpm i
      - name: Snyk monitor
        run: npx snyk monitor --all-projects
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  trivy-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@master
    - name: Run Trivy vulnerability scanner in fs mode
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: '.'
        scan-type: 'fs'
        scan-ref: '.'
        trivy-config: trivy.yaml
        format: 'github'
        output: 'dependency-results.sbom.json'
        github-pat: ${{ secrets.GITHUB_TOKEN }}
